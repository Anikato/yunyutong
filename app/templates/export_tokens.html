{% extends "base.html" %}
{% block title %}导出凭证 - 云域通{% endblock %}

{% block content %}
<section class="form-shell" aria-labelledby="export-title">
  <nav aria-label="面包屑">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('main.index') }}">工作台</a></li>
      <li class="breadcrumb-item active" aria-current="page">导出凭证</li>
    </ol>
  </nav>
  <div class="card form-panel">
    <div class="card-body">
      <h1 id="export-title" class="form-title">导出凭证</h1>
      <p class="text-muted mb-4">将 {{ token_count }} 个凭证下载为加密 JSON 文件。导入时需要使用同一个密码。</p>
      <form method="POST" id="exportForm">
        <div class="mb-3">
          <label for="export_password" class="form-label">导出密码</label>
          <input type="password" name="export_password" id="export_password" class="form-control"
                 autocomplete="new-password" required minlength="8" aria-describedby="export-password-help">
          <div id="export-password-help" class="form-text">至少 8 个字符。忘记此密码将无法解密导出文件。</div>
        </div>
        <div class="mb-4">
          <label for="confirm_password" class="form-label">确认导出密码</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" required>
        </div>
        <div class="workbench-actions">
          <button type="submit" class="btn btn-primary">下载加密文件</button>
          <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">取消</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  const exportPassword = document.getElementById('export_password');
  const confirmPassword = document.getElementById('confirm_password');
  const validatePassword = () => {
    confirmPassword.setCustomValidity(
      confirmPassword.value && confirmPassword.value !== exportPassword.value ? '两次输入的密码不一致。' : ''
    );
  };
  exportPassword.addEventListener('input', validatePassword);
  confirmPassword.addEventListener('input', validatePassword);
  document.getElementById('exportForm').addEventListener('submit', event => {
    validatePassword();
    if (!confirmPassword.reportValidity()) event.preventDefault();
  });
</script>
{% endblock %}
