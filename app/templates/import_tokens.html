{% extends "base.html" %}
{% block title %}导入凭证 - 云域通{% endblock %}

{% block content %}
<section class="form-shell" aria-labelledby="import-title">
  <nav aria-label="面包屑">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('main.index') }}">工作台</a></li>
      <li class="breadcrumb-item active" aria-current="page">导入凭证</li>
    </ol>
  </nav>
  <div class="card form-panel">
    <div class="card-body">
      <h1 id="import-title" class="form-title">导入凭证</h1>
      <p class="text-muted mb-4">选择云域通导出的 JSON 文件，并输入导出时设置的密码。</p>
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="import-file" class="form-label">凭证文件</label>
          <input type="file" id="import-file" name="import_file" class="form-control" accept=".json" required>
        </div>
        <div class="mb-4">
          <label for="import-password" class="form-label">导出密码</label>
          <input type="password" id="import-password" name="import_password" class="form-control" autocomplete="off" required>
        </div>
        <div class="workbench-actions">
          <button type="submit" class="btn btn-primary">导入凭证</button>
          <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">取消</a>
        </div>
      </form>
      <hr class="my-4">
      <p class="form-text mb-0">重名凭证会追加 <code>(imported)</code>。导入后，请在工作台验证凭证，再进入域名列表刷新。</p>
    </div>
  </div>
</section>
{% endblock %}
